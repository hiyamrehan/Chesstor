[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chesstor"
version = "0.1.0"
description = "Chesstor: real-time physical chess state reconstruction under visual uncertainty (FYP F26-064)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-chess>=1.10", "numpy>=1.24", "opencv-python-headless>=4.8", "pyyaml>=6.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
chesstor = "chesstor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: needs a Stockfish binary on PATH"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/chesstor/api/app.py" = ["B008"]   # FastAPI File()/Form() defaults are the framework idiom
