name: CD

# Release pipeline: a version tag (v*) re-runs the full test gate, builds the package and
# publishes a GitHub Release with the wheel, the frozen config and the evaluation results.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]" build
      - run: ruff check .
      - run: pytest --cov=chesstor --cov-fail-under=85
      - name: Frozen evaluation snapshot for this release
        run: |
          mkdir -p release
          chesstor evaluate --scenario special --games 18 --seed 103 --out release/eval_special.json
          chesstor evaluate --games 10 --plies 30 --seed 100 --out release/eval_random.json
          cp configs/default.yaml release/config_frozen.yaml
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build web app
        run: cd app && npm ci && npm run typecheck && npm test && npm run build && tar czf ../release/app-dist.tgz dist
      - run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            release/*
